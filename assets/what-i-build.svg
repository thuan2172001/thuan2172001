<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">What I Build</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080F1C"/>
      <stop offset="1" stop-color="#111124"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#00FF94"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="600" y="72" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">What I <tspan fill="#7C4DFF">Build</tspan></text>
  <rect x="450" y="90" width="300" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(56 130)">
      <rect width="252" height="150" rx="20" fill="#0B1422" stroke="#2E5B9A" stroke-width="2"/>
      <circle cx="52" cy="52" r="24" fill="#153B69"/><text x="52" y="60" text-anchor="middle" font-size="24">⬡</text>
      <text x="28" y="102" fill="#FFFFFF" font-size="24" font-weight="900">Scalable Systems</text>
      <text x="28" y="130" fill="#9AA7B8" font-size="15">architecture • APIs • reliability</text>
    </g>
    <g transform="translate(332 130)">
      <rect width="252" height="150" rx="20" fill="#0B1422" stroke="#6D4CCB" stroke-width="2"/>
      <circle cx="52" cy="52" r="24" fill="#32245A"/><text x="52" y="60" text-anchor="middle" font-size="24">✦</text>
      <text x="28" y="102" fill="#FFFFFF" font-size="24" font-weight="900">AI Automation</text>
      <text x="28" y="130" fill="#9AA7B8" font-size="15">agents • workflows • tooling</text>
    </g>
    <g transform="translate(608 130)">
      <rect width="252" height="150" rx="20" fill="#0B1422" stroke="#1C9D78" stroke-width="2"/>
      <circle cx="52" cy="52" r="24" fill="#103C35"/><text x="52" y="60" text-anchor="middle" font-size="24">☁</text>
      <text x="28" y="102" fill="#FFFFFF" font-size="24" font-weight="900">Cloud Infra</text>
      <text x="28" y="130" fill="#9AA7B8" font-size="15">deploy • observability • CI/CD</text>
    </g>
    <g transform="translate(884 130)">
      <rect width="252" height="150" rx="20" fill="#0B1422" stroke="#4D9FFF" stroke-width="2"/>
      <circle cx="52" cy="52" r="24" fill="#132E52"/><text x="52" y="60" text-anchor="middle" font-size="24">&gt;_</text>
      <text x="28" y="102" fill="#FFFFFF" font-size="24" font-weight="900">Developer Tools</text>
      <text x="28" y="130" fill="#9AA7B8" font-size="15">DX • platforms • automation</text>
    </g>
  </g>

  <text x="600" y="326" text-anchor="middle" fill="#AAB4C8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Backend architecture • APIs • Databases • CI/CD • Product engineering</text>
</svg>