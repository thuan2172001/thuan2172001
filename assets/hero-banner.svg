<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Trinh Van Thuan - Backend and Systems Engineer</title>
  <desc id="desc">Neon developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D9FFF"/>
      <stop offset="0.48" stop-color="#6EE7C7"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#00FF94"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#4D9FFF" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity="0.35"/>

  <path d="M845 0h355v132l-104-12-52 52-93-35-71 34-35-50z" fill="#4D9FFF" opacity="0.08"/>
  <path d="M1035 0h165v210l-60-22-38 38-47-18-20-54z" fill="#A855F7" opacity="0.10"/>
  <path d="M900 42l48 0 0 48-48 0z" fill="#00FF94" opacity="0.12" transform="rotate(45 924 66)"/>
  <path d="M1088 98l58 0 0 58-58 0z" fill="#4D9FFF" opacity="0.12" transform="rotate(45 1117 127)"/>

  <text x="62" y="68" fill="#6EE7C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">&lt;/&gt; IDEAS • SYSTEMS • PEOPLE • BETTER SOFTWARE</text>
  <line x1="62" y1="88" x2="735" y2="88" stroke="#34415a" stroke-width="2"/>
  <line x1="62" y1="88" x2="312" y2="88" stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>

  <text x="62" y="170" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">TRINH VAN</text>
  <text x="450" y="170" fill="url(#name)" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">THUAN</text>

  <rect x="62" y="196" width="154" height="44" rx="12" fill="#24264b" stroke="#5d63c6" stroke-width="1.5"/>
  <text x="139" y="225" fill="#FFFFFF" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">Leo Trinh</text>
  <text x="238" y="225" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Backend &amp; Systems Engineer • Full-Stack Developer</text>

  <text x="62" y="272" fill="#AAB4C8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">AI AUTOMATION  •  CLOUD  •  DEVELOPER TOOLS  •  PRODUCT BUILDER</text>

  <rect x="62" y="300" width="520" height="42" rx="21" fill="#0A1220" stroke="url(#line)" stroke-width="2"/>
  <text x="322" y="327" fill="#FFFFFF" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">🚀  Build  •  Measure  •  Improve  •  Ship  →</text>

  <g transform="translate(808 80)">
    <rect x="0" y="0" width="312" height="204" rx="18" fill="#08101b" stroke="#263652" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#00FF94"/>
    <circle cx="45" cy="24" r="6" fill="#4D9FFF"/>
    <circle cx="66" cy="24" r="6" fill="#A855F7"/>
    <text x="26" y="70" fill="#6EE7C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ build ideas</text>
    <text x="26" y="101" fill="#80A8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">&gt; ship products</text>
    <text x="26" y="132" fill="#B892FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">&gt; automate boring work</text>
    <text x="26" y="163" fill="#6EE7C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">&gt; make it scale</text>
    <text x="26" y="191" fill="#00FF94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">_</text>
  </g>
</svg>